# Cluster
spark.master                              spark://spark-master:7077
spark.driver.host                         spark-master
spark.driver.bindAddress                  0.0.0.0
spark.driver.memory                       1g
spark.executor.memory                     1536m

# Persistent Spark UI / History Server
spark.eventLog.enabled                    true
spark.eventLog.dir                        file:///opt/spark/work-dir/project/spark-events
spark.history.fs.logDirectory             file:///opt/spark/work-dir/project/spark-events
spark.history.ui.port                     18080
spark.ui.port                             4040

# Normal modern Spark behaviour: do NOT disable AQE or automatic broadcast.
spark.sql.adaptive.enabled                true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled       true

# Small local cluster: 32 is enough to expose shuffle behavior without creating hundreds
# of tiny tasks. This is a lab choice, not a production recommendation.
spark.sql.shuffle.partitions              32

# Keep output timestamps deterministic for this NYC dataset.
spark.sql.session.timeZone                America/New_York
